global:
  timezone: Europe/Zurich
  timezonePath: /etc/localtime
  springDebug: false
  namespace: kbe-brewery-inventory-failover

nameOverride: "kbe-brewery-inventory-failover"
fullnameOverride: "kbe-brewery-inventory-failover"

replicaCount: 1

image:
  # Those values are set by Maven filtering
  # and will be replaced with a valid version number during the build process.
  registry: @docker.repo@
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 8083
  targetPort: 8083
  nodePort: 30083

otelCollector:
  # Enables OTLP export of traces and metrics to the OpenTelemetry Collector.
  # Defaults to the collector deployed by the kbe-brewery-gateway chart.
  enabled: true
  serviceFQDN: "kbe-brewery-gateway-otel-collector.kbe-brewery-gateway.svc.cluster.local"
  port: 4318

externalAccess:
  host: "localhost"
  protocol: "http"

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

probes:
  startup:
    failureThreshold: 30
    periodSeconds: 10
  readiness:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  liveness:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

ingress:
  enabled: false

# Section for overriding values in subcharts.



