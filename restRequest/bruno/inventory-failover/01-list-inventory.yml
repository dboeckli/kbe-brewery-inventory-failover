info:
  name: list inventory failover
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:{{application-port}}/inventory-failover
  headers:
    - name: Accept
      value: application/json
    - name: traceparent
      value: 00-{{traceId}}-{{spanId}}-03
    - name: baggage
      value: testBaggage=inventory-failover
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("inventory-failover returns 200", function () {
            expect(res.status === 200, "expected 200 but got " + res.status).to.be.true;
        });
        test("inventory-failover returns one inventory", function () {
            expect(res.body.length === 1, "expected 1 inventory but got " + res.body.length).to.be.true;
        });
        test("inventory-failover returns the failover beer", function () {
            expect(res.body[0].beerId === "00000000-0000-0000-0000-000000000000").to.be.true;
            expect(res.body[0].quantityOnHand === 999).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Source: failover-service.http
