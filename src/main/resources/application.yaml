---
server:
  port: 8083
spring:
  application:
    name: "kbe-brewery-inventory-failover"
  threads:
    virtual:
      enabled: true
  docker:
    compose:
      enabled: false
      stop:
        command: "down"
management:
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  endpoints:
    access:
      default: "unrestricted"
    web:
      exposure:
        include: "*"
  endpoint:
    configprops:
      show-values: "ALWAYS"
    health:
      probes:
        enabled: true
      show-details: "always"
  info:
    build:
      enabled: true
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
    git:
      enabled: true
      mode: "full"
  httpexchanges:
    recording:
      enabled: true
      include: "request_headers, response_headers, session_id, time_taken"
  observations:
    annotations:
      enabled: true
    http:
      server:
        requests:
          name: "http.server.requests"
      client:
        requests:
          name: "http-client-requests"
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    propagation:
      type: w3c
      produce: w3c
      consume: w3c
    baggage:
      enabled: true
      # Specify which baggage fields should be propagated to downstream services
      correlation:
        # Also make baggage available in MDC for logging
        fields:
          - testBaggage
        enabled: true
      # Erlaubt das Empfangen des Headers "baggage: testBaggage=..." der im http request gesetzt wird
      remote-fields:
        - testBaggage
      # KOPIERT den Wert aus dem Baggage in die Span-Labels (Attributes)
      tag-fields:
        - testBaggage
    export:
      otlp:
        enabled: false
      enabled: true
    sampling:
      probability: 1.0
  logging:
    export:
      enabled: false
      otlp:
        enabled: false
  simple:
    metrics:
      export:
        enabled: false

logging:
  level:
    ch.dboeckli.springframeworkguru.kbe.inventory.failover.config.RequestLoggingWebFilter: DEBUG
